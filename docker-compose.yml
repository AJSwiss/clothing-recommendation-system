services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clothes
      POSTGRES_PASSWORD: clothes_dev
      POSTGRES_DB: clothes
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./server/db:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clothes -d clothes"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgres://clothes:clothes_dev@db:5432/clothes
      JWT_SECRET: change-me-in-production
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
